<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КОМАР — Кликер</title>
<style>
*{box-sizing:border-box}
body{
    margin:0; min-height:100vh; font-family:Arial,sans-serif;
    background:radial-gradient(circle at top,#25254a,#0d0d18 65%);
    color:white; display:flex; justify-content:center; overflow-x:hidden;
}
.wrap{width:min(1100px,94vw); padding:25px 0 40px}
header{text-align:center}
h1{font-size:48px;margin:5px 0 2px;text-shadow:0 0 18px #9d6cff}
.sub{opacity:.65;margin-bottom:18px}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.stat{background:#171727;border:1px solid #33334d;border-radius:14px;padding:10px 18px}
.stat b{display:block;font-size:24px;color:#b99cff}
.main{display:grid;grid-template-columns:1fr 330px;gap:20px;margin-top:20px}
.card{background:rgba(20,20,34,.9);border:1px solid #34344e;border-radius:22px;padding:20px;box-shadow:0 15px 40px #0005}
.click-area{min-height:470px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#mosquito{
    width:min(340px,70vw); max-height:310px; object-fit:contain;
    cursor:pointer; user-select:none; filter:drop-shadow(0 12px 20px #0008);
    transition:transform .08s;
}
#mosquito:active{transform:scale(.91) rotate(-2deg)}
.click-text{font-size:24px;margin-top:14px;color:#c8b5ff}
.float{
    position:fixed; pointer-events:none; font-size:28px; font-weight:bold;
    color:#9cffb1; animation:up 800ms ease-out forwards; z-index:5;
}
@keyframes up{to{transform:translateY(-100px);opacity:0}}
button{
    width:100%; border:0; border-radius:12px; padding:12px; margin:6px 0;
    background:#272741;color:white;font-size:15px;text-align:left;cursor:pointer;
}
button:hover:not(:disabled){background:#36365a}
button:disabled{opacity:.4;cursor:not-allowed}
.upgrade b{color:#d4c5ff}
.price{float:right;color:#91ffab}
.section-title{margin:4px 0 12px;font-size:22px}
.ach{display:flex;gap:10px;align-items:center;padding:9px;border-radius:10px;background:#18182a;margin:7px 0;opacity:.42}
.ach.done{opacity:1;border:1px solid #6552a5}
.ach .ico{font-size:25px}
.reset{background:#42242c;text-align:center}
small{opacity:.65}
@media(max-width:800px){.main{grid-template-columns:1fr}.click-area{min-height:400px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🦟 КОМАР</h1>
<div class="sub">Самый бесполезный, но почему-то затягивающий кликер</div>
<div class="stats">
 <div class="stat">Клики<b id="clicks">0</b></div>
 <div class="stat">Комаров<b id="mosquitos">0</b></div>
 <div class="stat">За клик<b id="power">1</b></div>
 <div class="stat">Автоклик<b id="auto">0</b>/сек</div>
</div>
</header>

<div class="main">
<section class="card click-area">
    <img id="mosquito" src="comar.png" alt="Комар" title="КЛИКАЙ!">
    <div class="click-text">Нажми на комара!</div>
</section>

<aside class="card">
    <h2 class="section-title">⬆️ Улучшения</h2>
    <div id="upgrades"></div>
    <h2 class="section-title" style="margin-top:20px">🏆 Достижения</h2>
    <div id="achievements"></div>
    <button class="reset" onclick="resetGame()">Сбросить прогресс</button>
</aside>
</div>
</div>

<script>
const sounds = ["gav.1","gav.2","gav.3"];
let game = JSON.parse(localStorage.getItem("mosquitoClicker")) || {
    clicks:0, mosquitos:0, power:1, auto:0, upgrades:{power:0,auto:0}, achievements:[]
};

const upgrades = [
 {id:"power",name:"Сильный укус",desc:"+1 клик за нажатие",base:25,scale:1.65},
 {id:"auto",name:"Комариная ферма",desc:"+1 автоклик в секунду",base:100,scale:1.8}
];

const achievements = [
 {id:"first",name:"Первый писк",desc:"Сделать 1 клик",need:g=>g.clicks>=1,icon:"🦟"},
 {id:"100",name:"Раздражитель",desc:"100 кликов",need:g=>g.clicks>=100,icon:"😈"},
 {id:"1000",name:"Кошмар",desc:"1 000 кликов",need:g=>g.clicks>=1000,icon:"💀"},
 {id:"power10",name:"Мощь комара",desc:"Сила клика 10+",need:g=>g.power>=10,icon:"⚡"},
 {id:"auto10",name:"Конвейер",desc:"10 автокликов/сек",need:g=>g.auto>=10,icon:"🏭"},
 {id:"million",name:"Король комаров",desc:"1 000 000 кликов",need:g=>g.clicks>=1000000,icon:"👑"}
];

function cost(u){
    return Math.floor(u.base * Math.pow(u.scale, game.upgrades[u.id]));
}
function save(){localStorage.setItem("mosquitoClicker",JSON.stringify(game))}
function format(n){return n.toLocaleString("ru-RU")}
function render(){
    clicks.textContent=format(game.clicks);
    mosquitos.textContent=format(game.mosquitos);
    power.textContent=format(game.power);
    auto.textContent=format(game.auto);

    upgradesDiv=document.getElementById("upgrades");
    upgradesDiv.innerHTML="";
    upgrades.forEach(u=>{
        const c=cost(u);
        const b=document.createElement("button");
        b.className="upgrade";
        b.disabled=game.mosquitos<c;
        b.innerHTML=`<b>${u.name}</b><br><small>${u.desc} • уровень ${game.upgrades[u.id]}</small><span class="price">🦟 ${format(c)}</span>`;
        b.onclick=()=>buy(u.id);
        upgradesDiv.appendChild(b);
    });

    achievementsDiv=document.getElementById("achievements");
    achievementsDiv.innerHTML="";
    achievements.forEach(a=>{
        const done=game.achievements.includes(a.id);
        const d=document.createElement("div");
        d.className="ach"+(done?" done":"");
        d.innerHTML=`<span class="ico">${done?"✅":a.icon}</span><div><b>${a.name}</b><br><small>${a.desc}</small></div>`;
        achievementsDiv.appendChild(d);
    });
}
function buy(id){
    const u=upgrades.find(x=>x.id===id), c=cost(u);
    if(game.mosquitos<c)return;
    game.mosquitos-=c;
    game.upgrades[id]++;
    if(id==="power")game.power++;
    if(id==="auto")game.auto++;
    save(); render(); checkAchievements();
}
function playSound(){
    const name=sounds[Math.floor(Math.random()*sounds.length)];
    // Поддерживаются файлы gav.1, gav.2, gav.3 как в запросе.
    // Если это MP3/WAV/OGG, укажи расширение ниже.
    const candidates=[name+".mp3",name+".wav",name+".ogg",name];
    let i=0;
    const tryNext=()=>{
        if(i>=candidates.length)return;
        const a=new Audio(candidates[i++]);
        a.volume=.55;
        a.oncanplaythrough=()=>{a.play().catch(()=>{});};
        a.onerror=tryNext;
        a.load();
    };
    tryNext();
}
function clickMosquito(e){
    game.clicks++;
    game.mosquitos+=game.power;
    playSound();
    const f=document.createElement("div");
    f.className="float";
    f.textContent="+"+game.power+" 🦟";
    f.style.left=(e.clientX-20)+"px"; f.style.top=(e.clientY-20)+"px";
    document.body.appendChild(f); setTimeout(()=>f.remove(),800);
    save(); render(); checkAchievements();
}
function checkAchievements(){
    achievements.forEach(a=>{
        if(!game.achievements.includes(a.id)&&a.need(game)){
            game.achievements.push(a.id);
            save();
            render();
        }
    });
}
function resetGame(){
    if(confirm("Точно сбросить весь прогресс?")){
        localStorage.removeItem("mosquitoClicker");
        location.reload();
    }
}
document.getElementById("mosquito").addEventListener("click",clickMosquito);
setInterval(()=>{
    if(game.auto>0){
        game.clicks+=game.auto;
        game.mosquitos+=game.auto;
        save(); render(); checkAchievements();
    }
},1000);
render();
</script>
</body>
</html>
